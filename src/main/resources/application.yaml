server:
  port: 8082
app:
  ai:
    provider: openai
  rag:
    force-rebuild: true
    top-k: 4
    similarity-threshold: 0.75
    radius: 1
    chunk:
        size: 800
        min-chunk-size: 200
        min-chunk-to-embed: 50
        max-num-chunks: 8192
        keep-separator: true
    pdf:
      mode: page #parrafo
      path: file:src/main/resources/rag/qa-over-internal-docs/*.pdf #classpath:rag/a-over-internal-docs/*.pdf -> esta forma no actualiza los documentos de forma dinamica
      pages-per-document: 1
      left-alignment: true
      number-of-top-text-lines-to-delete: 0
      number-of-bottom-text-lines-to-delete: 0
    synonyms:
      PTO: "paid time off"
      SSO: "single sign-on"
      MFA: "multi-factor authentication"
      2FA: "two-factor authentication"
      IaC: "infrastructure as code"
      PII: "personal data"
      CI/CD: "continuous integration and delivery"
      NAT: "network address translation"
      GDPR: "data protection regulation"
      VPN: "virtual private network"
      SDLC: "software development lifecycle"
      DNS: "domain name system"
      IP: "internet protocol"
      API: "application programming interface"
      SDK: "software development kit"
      UI: "user interface"
      UX: "user experience"
      DB: "database"
      SQL: "structured query language"
      NoSQL: "non-relational database"
      OS: "operating system"
      SSH: "secure shell"
      HTTP: "hypertext transfer protocol"
      HTTPS: "secure hypertext transfer protocol"

spring:
  application:
    name: geanai

  spring:
    ai:
      mcp:
        server:
          name: posture-service-mcp
          version: 1.0.0
          type: SYNC
          instructions: "este servidor ofrece servicios de análisis de la postura"
          sse-endpoint: /sse
          see-message-endpoint: mcp/message
          capabilities:
            tool: true
            resources: false
            prompt: false
            completion: false


  datasource:
    url: jdbc:postgresql://localhost:5432/postgresdb
    username: postgres
    password: postgres
  #sql:
  #  init:
  #    mode: always
  #    data-locations: classpath:/db/data.sql
  ai:
    openai:
      api-key: ${SPRING_IA_COURSE}
      chat:
        options:
          model: gpt-5.6-luna
          reasoning-effort: none
    chat:
            memory:
                repository:
                    jdbc:
                        # para local/dev spring AI crea la tabla de forma automatica
                        initialize-schema: always
    # Configuración del vector store sobre Postgres (pgvector).
    # Actúa sobre la base definida en spring.datasource (postgresdb):
    #   - initialize-schema: crea extensiones, tabla e índice si no existen (nunca los modifica).
    #   - index-type / distance-type: definen el índice HNSW con métrica coseno;
    #     la misma métrica se usa en las consultas de similitud.
    #   - dimensions: debe coincidir con spring.ai.openai.embedding.options.dimensions.
    # NOTA: si existe un @Bean PgVectorStore propio, este bloque se ignora.
    vectorstore:
          pgvector:
            table-name-for-chat-memory: chat_vector_store
            table-name-for-rag: rag_vector_store
            initialize-schema: true
            index-type: HNSW
            distance-type: COSINE_DISTANCE
            dimensions: 1536
            max-document-batch-size: 10_000
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
    huggingface:
      url: https://router.huggingface.co
      api-key: {HUGGINGFACE_API_KEY}
      model: facebook/bart-large-cnn
      max-new-tokens: 1024
      temperature: 0.7
logging:
  level:
    root: INFO
    com.genai.java.spring: INFO
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
